version: '3.8'

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: 'broker,controller'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  CLUSTER_ID: 'Mw2-hW8yT9O0M-1tC8t25Q'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:29093,2@kafka2:29093,3@kafka3:29093'

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.4.0
  networks:
    - azura-network

services:
  # --- MONGODB CONFIG SERVERS (rs-config) ---
  mongo-config-1:
    image: mongo:7.0
    container_name: mongo-config-1
    command: mongod --configsvr --replSet rs-config --port 27019 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_config_1_data:/data/configdb
    networks:
      - azura-network

  mongo-config-2:
    image: mongo:7.0
    container_name: mongo-config-2
    command: mongod --configsvr --replSet rs-config --port 27019 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_config_2_data:/data/configdb
    networks:
      - azura-network

  mongo-config-3:
    image: mongo:7.0
    container_name: mongo-config-3
    command: mongod --configsvr --replSet rs-config --port 27019 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_config_3_data:/data/configdb
    networks:
      - azura-network

  # --- MONGODB SHARD 1 (rs-shard1) ---
  mongo-shard1-1:
    image: mongo:7.0
    container_name: mongo-shard1-1
    command: mongod --shardsvr --replSet rs-shard1 --port 27018 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_shard1_1_data:/data/db
    networks:
      - azura-network

  mongo-shard1-2:
    image: mongo:7.0
    container_name: mongo-shard1-2
    command: mongod --shardsvr --replSet rs-shard1 --port 27018 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_shard1_2_data:/data/db
    networks:
      - azura-network

  mongo-shard1-3:
    image: mongo:7.0
    container_name: mongo-shard1-3
    command: mongod --shardsvr --replSet rs-shard1 --port 27018 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_shard1_3_data:/data/db
    networks:
      - azura-network

  # --- MONGODB SHARD 2 (rs-shard2) ---
  mongo-shard2-1:
    image: mongo:7.0
    container_name: mongo-shard2-1
    command: mongod --shardsvr --replSet rs-shard2 --port 27020 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_shard2_1_data:/data/db
    networks:
      - azura-network

  mongo-shard2-2:
    image: mongo:7.0
    container_name: mongo-shard2-2
    command: mongod --shardsvr --replSet rs-shard2 --port 27020 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_shard2_2_data:/data/db
    networks:
      - azura-network

  mongo-shard2-3:
    image: mongo:7.0
    container_name: mongo-shard2-3
    command: mongod --shardsvr --replSet rs-shard2 --port 27020 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo_shard2_3_data:/data/db
    networks:
      - azura-network

  # --- MONGODB ROUTER (Mongos) ---
  mongos-router:
    image: mongo:7.0
    container_name: mongos-router
    command: mongos --configdb rs-config/mongo-config-1:27019,mongo-config-2:27019,mongo-config-3:27019 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    depends_on:
      - mongo-config-1
      - mongo-config-2
      - mongo-config-3
      - mongo-shard1-1
      - mongo-shard2-1
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - azura-network

  # --- INIT SHARDED CLUSTER ---
  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on:
      mongos-router:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Initialisation des Replica Sets MongoDB...' &&
      sleep 10 &&
      mongosh --host mongo-config-1:27019 --eval \"rs.initiate({_id: 'rs-config', configsvr: true, members: [{_id:0, host:'mongo-config-1:27019'}, {_id:1, host:'mongo-config-2:27019'}, {_id:2, host:'mongo-config-3:27019'}]})\" || true &&
      mongosh --host mongo-shard1-1:27018 --eval \"rs.initiate({_id: 'rs-shard1', members: [{_id:0, host:'mongo-shard1-1:27018'}, {_id:1, host:'mongo-shard1-2:27018'}, {_id:2, host:'mongo-shard1-3:27018'}]})\" || true &&
      mongosh --host mongo-shard2-1:27020 --eval \"rs.initiate({_id: 'rs-shard2', members: [{_id:0, host:'mongo-shard2-1:27020'}, {_id:1, host:'mongo-shard2-2:27020'}, {_id:2, host:'mongo-shard2-3:27020'}]})\" || true &&
      echo 'Attente de la stabilisation des Replica Sets...' &&
      sleep 15 &&
      echo 'Ajout des Shards et activation du Sharding...' &&
      mongosh --host mongos-router:27017 --eval \"
        try { sh.addShard('rs-shard1/mongo-shard1-1:27018,mongo-shard1-2:27018,mongo-shard1-3:27018'); } catch(e){}
        try { sh.addShard('rs-shard2/mongo-shard2-1:27020,mongo-shard2-2:27020,mongo-shard2-3:27020'); } catch(e){}
        try { sh.enableSharding('azura_iot'); } catch(e){}
        try { sh.shardCollection('azura_iot.raw_measurements', { device_id: 'hashed' }); } catch(e){}
        print('Sharded Cluster MongoDB configuré avec succès !');
      \"
      "
    networks:
      - azura-network

  # --- MONGO EXPRESS UI ---
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mongo-express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongos-router:27017"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - azura-network

  # --- KAFKA KRAFT CLUSTER ---
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'INTERNAL://kafka1:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka1:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka1:19092,EXTERNAL://localhost:9092'
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka1:19092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'INTERNAL://kafka2:19092,EXTERNAL://0.0.0.0:9093,CONTROLLER://kafka2:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka2:19092,EXTERNAL://localhost:9093'
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka2:19092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: 'INTERNAL://kafka3:19092,EXTERNAL://0.0.0.0:9094,CONTROLLER://kafka3:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka3:19092,EXTERNAL://localhost:9094'
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka3:19092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- INIT KAFKA TOPICS ---
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for Kafka to be ready...' &&
      cub kafka-ready -b kafka1:19092 3 60 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka1:19092 --partitions 6 --replication-factor 3 --topic iot-raw-data &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka1:19092 --partitions 3 --replication-factor 2 --topic iot-processed &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka1:19092 --partitions 2 --replication-factor 2 --topic iot-alerts &&
      echo 'Kafka topics created successfully!'
      "
    networks:
      - azura-network

  # --- IOT SIMULATOR ---
  iot-simulator:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    container_name: iot-simulator
    restart: always
    environment:
      - KAFKA_BROKERS=kafka1:19092,kafka2:19092,kafka3:19092
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - azura-network

  # --- KAFKA UI (Interface Graphique) ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Azura-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:19092,kafka2:19092,kafka3:19092"
    networks:
      - azura-network

  # --- ZOOKEEPER CLUSTER (Quorum HA) ---
  zookeeper-1:
    image: zookeeper:3.8
    container_name: zookeeper-1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
    networks:
      - azura-network

  zookeeper-2:
    image: zookeeper:3.8
    container_name: zookeeper-2
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
    networks:
      - azura-network

  zookeeper-3:
    image: zookeeper:3.8
    container_name: zookeeper-3
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
    networks:
      - azura-network

  # --- SPARK CLUSTER ---
  spark-master-1:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-master-1
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_DAEMON_JAVA_OPTS=-Dspark.deploy.recoveryMode=ZOOKEEPER -Dspark.deploy.zookeeper.url=zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181 -Dspark.deploy.zookeeper.dir=/spark
    ports:
      - "8081:8080" # Spark UI master 1
      - "7077:7077" # Spark Master 1 port
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - azura-network

  spark-master-2:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-master-2
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_DAEMON_JAVA_OPTS=-Dspark.deploy.recoveryMode=ZOOKEEPER -Dspark.deploy.zookeeper.url=zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181 -Dspark.deploy.zookeeper.dir=/spark
    ports:
      - "8083:8080" # Spark UI master 2
      - "7078:7077" # Spark Master 2 port
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - azura-network

  spark-worker-1:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-worker-1
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master-1:7077,spark-master-2:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master-1
      - spark-master-2
    networks:
      - azura-network

  spark-worker-2:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-worker-2
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master-1:7077,spark-master-2:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master-1
      - spark-master-2
    networks:
      - azura-network

  spark-submit:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-submit
    user: root
    restart: on-failure
    depends_on:
      spark-master-1:
        condition: service_healthy
      spark-master-2:
        condition: service_healthy
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
    ports:
      - "4040:4040" # Spark Job UI (Driver)
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - spark_checkpoints:/opt/spark/checkpoints
    command: >
      bash -c "spark-submit --master spark://spark-master-1:7077,spark-master-2:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.mongodb.spark:mongo-spark-connector_2.12:10.3.0 /opt/spark/jobs/stream_processor.py"
    networks:
      - azura-network

  # --- EXPORTERS (MONITORING INFRASTRUCTURE) ---
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    ports:
      - "9100:9100"
    networks:
      - azura-network

  telegraf:
    image: telegraf:1.30.2
    container_name: telegraf
    restart: always
    user: root  # Nécessaire pour lire le socket Docker
    environment:
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_MOUNT_PREFIX=/hostfs
    ports:
      - "9273:9273"
    volumes:
      - ./monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
    networks:
      - azura-network



  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    restart: always
    command:
      - --kafka.server=kafka1:19092
      - --kafka.server=kafka2:19092
      - --kafka.server=kafka3:19092
    ports:
      - "9308:9308"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - azura-network

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    restart: always
    command:
      - --mongodb.uri=mongodb://mongos-router:27017
      - --compatible-mode
      - --collect-all
    ports:
      - "9216:9216"
    networks:
      - azura-network
    depends_on:
      - mongos-router

  mongodb-exporter-shard1:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter-shard1
    restart: always
    command:
      - --mongodb.uri=mongodb://mongo-shard1-2:27018/?directConnection=true
      - --compatible-mode
      - --collect-all
    ports:
      - "9217:9216"
    networks:
      - azura-network
    depends_on:
      - mongo-shard1-2

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - kafka-exporter
      - telegraf
    networks:
      - azura-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana:/var/lib/grafana/dashboards:ro
    networks:
      - azura-network

  # --- AZURA WEBAPP BACKEND (FASTAPI + WEBSOCKETS) ---
  azura-api:
    build: ./webapp/backend
    container_name: azura-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKERS=kafka1:19092,kafka2:19092,kafka3:19092
      - MONGO_URI=mongodb://mongos-router:27017
    depends_on:
      kafka1:
        condition: service_healthy
      mongos-router:
        condition: service_healthy
    networks:
      - azura-network

volumes:
  mongo_config_1_data:
  mongo_config_2_data:
  mongo_config_3_data:
  mongo_shard1_1_data:
  mongo_shard1_2_data:
  mongo_shard1_3_data:
  mongo_shard2_1_data:
  mongo_shard2_2_data:
  mongo_shard2_3_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  spark_checkpoints:
  prometheus_data:
  grafana_data:

networks:
  azura-network:
    driver: bridge
