version: '3.8'

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: 'broker,controller'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  CLUSTER_ID: 'Mw2-hW8yT9O0M-1tC8t25Q'
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:29093,2@kafka2:29093,3@kafka3:29093'

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.4.0
  networks:
    - azura-network

services:
  # --- MONGODB CLUSTER ---
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - azura-network

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - azura-network

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - azura-network

  # --- KAFKA KRAFT CLUSTER ---
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: 'INTERNAL://kafka1:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka1:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka1:19092,EXTERNAL://localhost:9092'
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: 'INTERNAL://kafka2:19092,EXTERNAL://0.0.0.0:9093,CONTROLLER://kafka2:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka2:19092,EXTERNAL://localhost:9093'
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: 'INTERNAL://kafka3:19092,EXTERNAL://0.0.0.0:9094,CONTROLLER://kafka3:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka3:19092,EXTERNAL://localhost:9094'
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # --- INIT KAFKA TOPICS ---
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    command: >
      bash -c "
      echo 'Waiting for Kafka to be ready...' &&
      cub kafka-ready -b kafka1:19092 1 40 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka1:19092 --partitions 6 --replication-factor 3 --topic iot-raw-data &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka1:19092 --partitions 3 --replication-factor 2 --topic iot-processed &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka1:19092 --partitions 2 --replication-factor 2 --topic iot-alerts &&
      echo 'Kafka topics created successfully!'
      "
    networks:
      - azura-network

  # --- IOT SIMULATOR ---
  iot-simulator:
    build:
      context: .
      dockerfile: simulators/Dockerfile
    container_name: iot-simulator
    environment:
      - KAFKA_BROKERS=kafka1:19092,kafka2:19092,kafka3:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - azura-network

  # --- KAFKA UI (Interface Graphique) ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Azura-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:19092,kafka2:19092,kafka3:19092"
    networks:
      - azura-network
  # --- SPARK CLUSTER ---
  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-master
    user: root
    environment:
      - SPARK_MODE=master
    ports:
      - "8081:8080" # Spark UI master
      - "7077:7077" # Spark Master port
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    networks:
      - azura-network

  spark-worker-1:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-worker-1
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    networks:
      - azura-network

  spark-worker-2:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-worker-2
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    networks:
      - azura-network

  spark-submit:
    image: bitnamilegacy/spark:3.5.1
    container_name: spark-submit
    user: root
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - spark_checkpoints:/opt/spark/checkpoints
    command: >
      bash -c "
      echo 'En attente du Master Spark...' &&
      sleep 15 &&
      spark-submit \
        --master spark://spark-master:7077 \
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.mongodb.spark:mongo-spark-connector_2.12:10.3.0 \
        /opt/spark/jobs/stream_processor.py
      "
    networks:
      - azura-network

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  spark_checkpoints:

networks:
  azura-network:
    driver: bridge
