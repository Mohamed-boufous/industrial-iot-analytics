# Configuration globale de Telegraf
[global_tags]
  env = "production"

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "15s"
  flush_jitter = "0s"
  precision = "0s"
  omit_hostname = false

# -------------------------------------------------------------------------
# OUTPUT PLUGINS (Où Telegraf envoie les données)
# -------------------------------------------------------------------------

# Expose les métriques sur un port web pour que Prometheus vienne les lire
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"

# -------------------------------------------------------------------------
# INPUT PLUGINS (Où Telegraf va chercher les données)
# -------------------------------------------------------------------------

# 1. Récupère le CPU, la RAM, et le Réseau des conteneurs via le socket Docker
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  timeout = "5s"
  perdevice = true
  total = false

# 2. Récupère le CPU global du serveur (Host Health)
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  fielddrop = ["time_*"]

# 3. Récupère la RAM globale du serveur (Host Health)
[[inputs.mem]]

# 4. Récupère le Disque du serveur (Host Health)
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# 5. Récupère l'Uptime et les informations système (Host Health)
[[inputs.system]]
